<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base matching Android 14+ Material You -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2a334a" stroke-width="4"/>
  <!-- Glowing Lambda / L Monogram -->
  <g filter="url(#glow)">
    <path d="M 190 130 L 260 270 L 325 400 M 260 270 L 360 400" fill="none" stroke="url(#glyphGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="260" cy="270" r="14" fill="#38bdf8"/>
    <circle cx="190" cy="130" r="12" fill="#818cf8"/>
    <circle cx="325" cy="400" r="12" fill="#6366f1"/>
    <circle cx="360" cy="400" r="12" fill="#38bdf8"/>
  </g>
  <!-- Subtle brand text -->
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="28" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="6">LEXIS</text>
</svg>
